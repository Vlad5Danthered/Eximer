<article class="blog-card">
  <div class="row">
    <div class="blog-card__image">
      <picture>
        <source srcset="img/blog-@@image.webp" type="image/webp">
        <img src="img/blog-@@image.png" alt="card" width="400" height="248">
      </picture>
    </div>
    <div class="blog-card__text">
      <h2 class="h3 blog-card__title">@@title</h2>
      <p class="blog-card__description">@@text</p>
      <a href="#">Детальніше</a>
    </div>
  </div>
</article>
